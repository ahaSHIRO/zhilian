# JVM 参数：给 Gradle 守护进程 4G 内存
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# 非传递 R 类（加快构建、避免 R 冲突）
android.nonTransitiveRClass=true

# 项目路径含中文（c:\Code\Android\知练），AGP 默认检查会拒绝；纯 Compose 无 NDK，可豁免
android.overridePathCheck=true

# 官方 Kotlin 代码风格
kotlin.code.style=official

# 构建缓存与配置缓存
org.gradle.caching=true
org.gradle.configuration-cache=true

# JVM 网络代理（Clash）：Kotlin 构建工具会从 github.com 下载，直连不可达；
# 注意 Clash 未运行时本机构建会失败，可临时注释以下 6 行
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65512
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65512
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
