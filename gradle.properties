# Gradle 守护进程堆上限。JVM 堆涨上去不会归还给系统（不是泄漏，是正常行为），所以上限就是长期占用；
# 16GB 机器上 4G 上限会一直吃掉 2–3GB。本模块 62 个源文件，2G 够用（assembleRelease 含 R8 + lintVital 实测通过）。
# 临时改上限走命令行 `-Dorg.gradle.jvmargs=…`（实测优先于本文件），但会新起一个不可复用的
# 守护进程、旧的那个并未退出——不要在同一个项目里来回切换上限值。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin 编译守护进程单独限堆（不写则与 Gradle daemon 叠加，两个 JVM 各拿一个上限）
kotlin.daemon.jvmargs=-Xmx1024m

# 空闲多久自动退出守护进程（默认 10800000 = 3 小时）。改 10 分钟：构建完就把内存还给系统
org.gradle.daemon.idletimeout=600000

# AndroidX
android.useAndroidX=true

# 非传递 R 类（加快构建、避免 R 冲突）
android.nonTransitiveRClass=true

# 项目路径含中文（c:\Code\Android\知练），AGP 默认检查会拒绝；纯 Compose 无 NDK，可豁免
android.overridePathCheck=true

# 官方 Kotlin 代码风格
kotlin.code.style=official

# 构建缓存与配置缓存
org.gradle.caching=true
org.gradle.configuration-cache=true

# JVM 网络代理（Clash）：Kotlin 构建工具会从 github.com 下载，直连不可达；
# 注意 Clash 未运行时本机构建会失败，可临时注释以下 6 行
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65512
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65512
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
